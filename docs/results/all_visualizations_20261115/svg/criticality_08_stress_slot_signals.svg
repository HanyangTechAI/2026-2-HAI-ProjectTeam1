    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>S2/S3/S5 stress preflight: selection and slot-detection signals</dc:title>
    <dc:description>Each measure has 40 scenarios. v0.1 and v0.2 reuse the same development dataset; 480 contexts per run. S2 reverses importance; S3 tests valid/missing evidence; S5 tests conflict. Selection and detection signals are different measures; neither execution blocking nor LLM correctness is measured. Report aggregates; individual run files unavailable locally. No confidence intervals reported. Sources: docs/experiments/reports/task-criticality-s235-stress-preflight-2026-11-12.md; docs/experiments/reports/task-criticality-s235-v02-preflight-2026-11-13.md</dc:description>
