    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>S2/S3/S5 stress preflight: context exposure before and after v0.2</dc:title>
    <dc:description>Bars count memory items summed across 40 scenarios per variant, not scenario success rates. v0.2 removes invalid S3 evidence, while S5's two conflicting memories remain exposed in every scenario. Selection-only development data; no LLM generation or tool execution. Report aggregates; individual run files unavailable locally. No confidence intervals reported. Sources: docs/experiments/reports/task-criticality-s235-stress-preflight-2026-11-12.md; docs/experiments/reports/task-criticality-s235-v02-preflight-2026-11-13.md</dc:description>
