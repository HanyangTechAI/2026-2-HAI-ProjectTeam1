    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Safety Gate ON: allowed and blocked scripted actions by variant</dc:title>
    <dc:description>Identical aggregate results in Freeze 1.0.4 and 1.0.5; 40 scenarios per variant. Fixed valid S2/S3_VALID actions were allowed; deliberately ungrounded S3_EMPTY/S5 actions were blocked before ToolExecutor. No LLM generation or multi-step agent evaluation. Report aggregates; individual run files unavailable locally. No confidence intervals reported. Sources: docs/experiments/reports/task-criticality-safety-gate-2026-11-15.md</dc:description>
