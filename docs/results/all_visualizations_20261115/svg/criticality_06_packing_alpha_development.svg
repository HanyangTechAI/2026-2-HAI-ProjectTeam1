 <title>Packing alpha: long critical memory with short distractors</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Packing alpha: long critical memory with short distractors</dc:title>
    <dc:description>Condition C, 75% normalized budget; same development data, not an independent holdout. Score=utility / tokens**alpha. LLM: 40 scenarios per tested alpha, 120 one-step runs; alpha=0.5 was selection-only. Critical context inclusion equals first-action correctness in all reported LLM arms. Report aggregates; individual run files unavailable locally. No confidence intervals reported. Sources: docs/experiments/reports/packing-alpha-development-2026-11-12.md</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
