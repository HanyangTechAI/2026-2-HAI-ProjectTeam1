    <dc:title>Ablation: paired success differences and 95% CI</dc:title>
    <dc:description>Experiment: 11 Nov 2026; Gemini 3.1 Flash-Lite; horizon=100 turns. 40 base tasks x 2 repeats per condition; repeats are not independent tasks. Legacy v1.0.3 no_temporal removes BOTH temporal resolution and mandatory state. 2K: 80 sample/repeat pairs, clustered by 40 base tasks; 2,000 bootstrap resamples, seed 42. All intervals touch or include zero; no multiplicity adjustment or equivalence test. Sources: docs/results/ablation_2k_h100_20261111/deltas.json; docs/experiments/reports/ablation-2k-h100-2026-11-11.md; docs/experiments/reports/ablation-2k-h100-analysis-2026-11-11.md</dc:description>
